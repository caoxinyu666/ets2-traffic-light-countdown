; 前方信号灯倒计时 HUD 配置。自动模式直接读取游戏内信号灯，无需 ETS2LA。
; 位置为屏幕宽高比例，字号按 972p 参考高度缩放。
; Ctrl+Shift+Backspace 打开面板，F11 显示/隐藏。1=开，0=关。
[Display]
Enabled=1
X=0.5000
Y=0.0700
FontSize=24.0000
Opacity=1.0000
; 前方信号灯识别距离，范围 100-400 米。
DetectionDistance=250
[Hotkeys]
; Windows 虚拟键码：8=Backspace，122=F11。修饰键：1=需要，0=不需要。
Settings=8
SettingsCtrl=1
SettingsShift=1
Toggle=122
